{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Artist Profile</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="{% static 'edit_A_Profile.css' %}">
</head>

<body>

<div class="container">

<a href="{% url 'artist_dashboard' %}" class="profile-btn">
<i class="fa-solid fa-user-circle"></i> Profile
</a>

<div class="box">

<h1 class="title">Edit Artist Profile</h1>
{% if status  %}
<div class="alert alert-primary">{{ status }}</div>
{% endif %}

<form method="post" enctype="multipart/form-data">
{% csrf_token %}
<!-- Personal Details -->
<h2 class="sub-title">Personal Details</h2>

<div class="grid">

<div class="field">
<label>First name</label>
<input type="text" name="fname" placeholder="Enter First Name" value="{{ user.first_name }}">
</div>

<div class="field">
<label>Last name</label>
<input type="text" name="lname" placeholder="Enter Last Name" value="{{ user.last_name }}">
</div>

<div class="field">
<label>Email</label>
<input type="email" name="email" placeholder="Enter Email" value="{{ user.email }}">
</div>

<div class="field">
<label>Contact Number</label>
<input type="text" name="contact" placeholder="Enter Contact Number" value="{{ data.contact_number }}"  pattern="[0-9]{10}" title="Number must contain 10 digits only!!">
</div>

<div class="field">
<label>Experience</label>
<input type="text" name="experience" placeholder="Enter Experience" value="{{ data.experience }}">
</div>

<div class="field">
<label>Age</label>
<input type="number" name="age" placeholder="Enter your age" value="{{ data.age }}" min="15" max="99">
</div>

<div class="field">
<label>Gender</label>
<select name="gender" id="" value="{{ data.gender }}">
{% if data.gender == "Male" %}
    <option value="Male" selected>Male</option>
{% else %}
    <option value="Male">Male</option>
{% endif %}
{% if data.gender == "Female" %}
    <option value="Female" selected>Female</option>
{% else %}
    <option value="Female">Female</option>
{% endif %}
{% if data.gender == "Others" %}
<option value="Others" selected>Others</option>
{% else %}
<option value="Others">Others</option>
{% endif %}
</select>
</div>

<div class="field">
<label>Profile Image</label>
<input type="file" name="image">
</div>

<div class="field full">
<label>Address</label>
<textarea name="address" placeholder="Enter Address">{{ data.address }}</textarea>
</div>

<div class="field full">
<label>Bio</label>
<textarea name="bio" placeholder="Enter Bio">{{ data.bio }}</textarea>
</div>

</div>

<!-- UPI Details -->
<h2 class="sub-title">UPI Details</h2>

<div class="grid">

<div class="field">
<label>UPI ID</label>
<input type="text" name="upi_id" placeholder="artist@upi" value="{{ data.upi_id }}">
</div>

<div class="field">
<label>UPI Number</label>
<input type="text" name="upi_number" placeholder="Enter mobile linked with UPI" value="{{ data.upi_number }}" pattern="[0-9]{10}" title="Number must contain 10 digits only!!">
</div>

</div>

<button type="submit" class="btn">
Save Changes
</button>

</form>

</div>
</div>
{% if status %}
<script>
    alert("{{ status }}");
    window.location.href = "{% url 'edit_artist_profile' %}";
</script>
{% endif %}
</body>
</html>
